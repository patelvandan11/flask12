<!-- AI Chatbot Floating Widget -->
<div id="aiChatWidget" class="chat-widget">
    
    <!-- Chat Trigger Button -->
    <button id="chatTriggerBtn" class="chat-trigger-btn" aria-label="Open AI Assistant" title="Chat with Vandan's AI Profile">
        <i class="fa-solid fa-robot"></i>
        <span class="chat-trigger-pulse"></span>
    </button>

    <!-- Chat Modal Window -->
    <div id="chatModal" class="chat-modal glass-card">
        
        <!-- Header -->
        <div class="chat-header">
            <div class="chat-header-info">
                <div class="chat-avatar">
                    <i class="fa-solid fa-brain"></i>
                    <span class="online-indicator"></span>
                </div>
                <div>
                    <h3 class="chat-title">Vandan's AI Assistant</h3>
                    <p class="chat-subtitle">Ask me anything about Vandan's profile</p>
                </div>
            </div>
            <button id="chatCloseBtn" class="chat-header-btn" aria-label="Close Chat">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Messages Area -->
        <div id="chatMessages" class="chat-messages">
            <div class="chat-bubble bot-bubble">
                <p>👋 Hello! I am <strong>Vandan's AI Assistant</strong>.</p>
                <p style="margin-top: 0.4rem;">Feel free to ask me anything about Vandan Patel's profile, skills, work experience, projects, or contact information.</p>
            </div>
        </div>

        <!-- Input Area -->
        <form id="chatForm" class="chat-input-area">
            <input type="text" id="chatInput" class="chat-input" placeholder="Type your question..." autocomplete="off" required>
            <button type="submit" id="chatSendBtn" class="chat-send-btn" aria-label="Send Message">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>

    </div>
</div>

<style>
/* Floating Chat Widget Styles */
.chat-widget {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    z-index: 10000;
}

.chat-trigger-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-violet) 100%);
    color: #ffffff;
    border: none;
    cursor: pointer;
    font-size: 1.4rem;
    box-shadow: 0 8px 24px var(--accent-cyan-glow);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
}

.chat-trigger-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 12px 30px var(--accent-cyan-glow);
}

.chat-trigger-pulse {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 12px;
    height: 12px;
    background: #10b981;
    border: 2px solid #ffffff;
    border-radius: 50%;
}

.chat-modal {
    position: fixed;
    bottom: 5.5rem;
    right: 1.5rem;
    width: 380px;
    max-width: calc(100vw - 3rem);
    height: 540px;
    max-height: calc(100vh - 7rem);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: scale(0.9) translateY(20px);
    opacity: 0;
    visibility: hidden;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, visibility 0.3s ease;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    border-radius: var(--radius-lg);
}

.chat-modal.open {
    transform: scale(1) translateY(0);
    opacity: 1;
    visibility: visible;
}

.chat-header {
    padding: 1rem 1.25rem;
    background: rgba(125, 125, 125, 0.06);
    border-bottom: 1px solid var(--border-glass);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.chat-header-info {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.chat-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--accent-cyan-glow);
    border: 1px solid var(--border-glass-bright);
    color: var(--accent-cyan);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.online-indicator {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 9px;
    height: 9px;
    background: #10b981;
    border-radius: 50%;
    border: 1px solid #ffffff;
}

.chat-title {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.2;
}

.chat-subtitle {
    font-size: 0.72rem;
    color: var(--text-muted);
}

.chat-header-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 0.3rem;
    transition: color 0.2s ease;
}

.chat-header-btn:hover {
    color: var(--text-primary);
}

.chat-messages {
    flex: 1;
    padding: 1.25rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.chat-bubble {
    max-width: 85%;
    padding: 0.85rem 1.1rem;
    border-radius: var(--radius-md);
    font-size: 0.88rem;
    line-height: 1.55;
    word-break: break-word;
}

.user-bubble {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--accent-cyan) 0%, #1d4ed8 100%);
    color: #ffffff;
    border-bottom-right-radius: 4px;
}

.bot-bubble {
    align-self: flex-start;
    background: rgba(125, 125, 125, 0.08);
    border: 1px solid var(--border-glass);
    color: var(--text-primary);
    border-bottom-left-radius: 4px;
}

.chat-input-area {
    padding: 0.85rem 1.25rem;
    background: rgba(125, 125, 125, 0.04);
    border-top: 1px solid var(--border-glass);
    display: flex;
    gap: 0.5rem;
}

.chat-input {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-full);
    padding: 0.6rem 1rem;
    font-size: 0.88rem;
    color: var(--text-primary);
    outline: none;
}

.chat-input:focus {
    border-color: var(--accent-cyan);
}

.chat-send-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--accent-cyan);
    color: #ffffff;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    transition: var(--transition-fast);
}

.chat-send-btn:hover {
    transform: scale(1.05);
    background: #1d4ed8;
}

/* Typing Indicator Animation */
.typing-dots {
    display: inline-flex;
    align-items: center;
    gap: 4px;
}

.typing-dots span {
    width: 6px;
    height: 6px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: typing 1.4s infinite ease-in-out;
}

.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing {
    0%, 100% { transform: translateY(0); opacity: 0.4; }
    50% { transform: translateY(-4px); opacity: 1; }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const chatTriggerBtn = document.getElementById('chatTriggerBtn');
    const chatModal = document.getElementById('chatModal');
    const chatCloseBtn = document.getElementById('chatCloseBtn');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const chatMessages = document.getElementById('chatMessages');

    let messageHistory = [];

    // Toggle Chat Modal
    if (chatTriggerBtn && chatModal) {
        chatTriggerBtn.addEventListener('click', function() {
            chatModal.classList.toggle('open');
            if (chatModal.classList.contains('open')) {
                chatInput.focus();
            }
        });
    }

    if (chatCloseBtn && chatModal) {
        chatCloseBtn.addEventListener('click', function() {
            chatModal.classList.remove('open');
        });
    }

    // Submit Message Form
    if (chatForm) {
        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text) return;

            chatInput.value = '';
            processUserQuery(text);
        });
    }

    function processUserQuery(text) {
        appendUserMessage(text);
        messageHistory.push({ role: 'user', content: text });

        const typingId = showTypingIndicator();

        fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                messages: messageHistory
            })
        })
        .then(res => res.json())
        .then(data => {
            removeTypingIndicator(typingId);
            const reply = data.reply || "Sorry, I couldn't fetch a response.";
            appendBotMessage(reply);
            messageHistory.push({ role: 'assistant', content: reply });
        })
        .catch(err => {
            removeTypingIndicator(typingId);
            appendBotMessage("⚠️ Network error occurred while connecting to AI assistant.");
        });
    }

    function appendUserMessage(text) {
        const div = document.createElement('div');
        div.className = 'chat-bubble user-bubble';
        div.textContent = text;
        chatMessages.appendChild(div);
        scrollToBottom();
    }

    function appendBotMessage(text) {
        const div = document.createElement('div');
        div.className = 'chat-bubble bot-bubble';
        div.innerHTML = parseMarkdownSimple(text);
        chatMessages.appendChild(div);
        scrollToBottom();
    }

    function showTypingIndicator() {
        const id = 'typing_' + Date.now();
        const div = document.createElement('div');
        div.id = id;
        div.className = 'chat-bubble bot-bubble';
        div.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
        chatMessages.appendChild(div);
        scrollToBottom();
        return id;
    }

    function removeTypingIndicator(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }

    function scrollToBottom() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function parseMarkdownSimple(text) {
        if (!text) return '';
        let html = text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color: var(--accent-cyan); text-decoration: underline;">$1</a>')
            .replace(/\n\n/g, '<br><br>')
            .replace(/\n- (.*?)/g, '<br>&bull; $1')
            .replace(/\n/g, '<br>');
        return html;
    }
});
</script>
