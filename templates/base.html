<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Vandan Patel | AI Engineer{% endblock %}</title>

    <!-- Early Theme Script to prevent flash of wrong theme -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('portfolio-theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.add('light');
            }
        })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Core Glassmorphism Theme CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    {% block css %}{% endblock %}
</head>
<body id="top">

    <!-- Header / Navigation Bar -->
    {% include 'navbar.html' %}
    
    <main class="page-content">
        <!-- Block for profile pic / hero -->
        {% block Pro %}{% endblock %}

        <!-- Block for main content -->
        {% block content %}{% endblock %}

        <!-- Block for project section -->
        {% block project %}{% endblock %}
    </main>

    <!-- Footer -->
    {% block footer %}
    {% include 'footer.html' %}
    {% endblock %}

    <!-- AI Chatbot Widget -->
    {% include 'chatbot.html' %}

</body>
</html>
