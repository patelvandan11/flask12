{% extends 'base.html' %}

{% block title %}Calculation Error | Vandan Patel{% endblock %}

{% block content %}
<div class="container">
    
    <header class="page-header">
        <h1 class="page-title">Calculation <span class="gradient-text">Error</span></h1>
    </header>

    <div class="glass-card form-card" style="text-align: center; padding: 3rem 2rem;">
        <div style="width: 70px; height: 70px; border-radius: 50%; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #ef4444; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 1.5rem;">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>

        <h2 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 0.75rem;">Calculation Failed</h2>

        <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 2rem; background: rgba(15, 23, 42, 0.6); padding: 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border-glass); font-family: var(--font-code);">
            {{ error_message }}
        </p>

        <a href="/karl_pearson" class="btn btn-secondary">
            <i class="fa-solid fa-arrow-left"></i> Return to Calculator
        </a>
    </div>

</div>
{% endblock %}
